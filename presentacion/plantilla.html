<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VLANs en AWS</title>
<style>
:root{
  --tinta:#232F3E; --fondo:#161E2D; --fondo2:#1B2637; --panel:#202C40; --linea:#33425B;
  --naranja:#FF9900; --texto:#F2F3F3; --suave:#A9B6C9; --tenue:#7C8AA0;
  --red:#8C4FFF; --computo:#ED7100; --datos:#C925D1; --seguridad:#DD344C; --gestion:#E7157B;
  --publica:#7AA116; --privada:#00A4A6; --ok:#3FB950; --no:#FF6B6B;
  --sans:-apple-system,"SF Pro Display","Helvetica Neue","Segoe UI",Arial,sans-serif;
  --mono:"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0B101A;overflow:hidden;font-family:var(--sans);color:var(--texto)}
#escena{position:fixed;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;padding:92px 112px 96px;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .45s ease;
  background:radial-gradient(1200px 700px at 88% -10%,#2A3A56 0%,transparent 60%),linear-gradient(160deg,var(--fondo2),var(--fondo))}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:64px 64px;
  mask-image:linear-gradient(180deg,#000 0%,transparent 75%)}
.slide.activa{opacity:1;visibility:visible}
.slide>*{position:relative}
.ceja{font-size:24px;font-weight:700;letter-spacing:5px;text-transform:uppercase;color:var(--naranja);margin-bottom:14px}
h1{font-size:150px;line-height:1;font-weight:800;letter-spacing:-4px}
h2{font-size:66px;line-height:1.08;font-weight:750;letter-spacing:-1.5px;margin-bottom:38px}
h2 em,h1 em{font-style:normal;color:var(--naranja)}
h3{font-size:32px;font-weight:700;line-height:1.2}
p{font-size:28px;line-height:1.45;color:var(--suave)}
b{color:var(--texto);font-weight:700}
.mono{font-family:var(--mono)}
.fila{display:flex;gap:28px}.col{display:flex;flex-direction:column;gap:20px}.crece{flex:1}
.tarjeta{background:linear-gradient(180deg,#ffffff0d,#ffffff05);border:1px solid var(--linea);border-radius:20px;padding:30px 32px}
.chip{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:650;padding:8px 18px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.ico{width:72px;height:72px;flex:none;border-radius:6px}
.ico.g{width:96px;height:96px}.ico.p{width:52px;height:52px}
.inv{filter:invert(1) brightness(1.7)}
.pie{position:absolute!important;left:112px;right:112px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font-size:20px;color:var(--tenue)}
.pie img{height:34px;opacity:.85}
.pie .n{font-family:var(--mono);font-size:20px}
.term{background:#0D1117;border:1px solid #30363D;border-radius:14px;padding:20px 24px;font-family:var(--mono);font-size:22px;line-height:1.5;color:#E6EDF3;white-space:pre-wrap;overflow:hidden}
.term .p{color:#7EE787}.term .ok{color:var(--ok);font-weight:700}.term .no{color:var(--no);font-weight:700}.term .c{color:#8B949E}
.paso{opacity:0;transform:translateY(18px);transition:opacity .5s ease,transform .5s ease}
.paso.visto{opacity:1;transform:none}
#barra{position:fixed;left:0;bottom:0;height:5px;background:var(--naranja);transition:width .35s ease;z-index:9}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes pulso{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes trazo{to{stroke-dashoffset:-48}}
.flujo{stroke-dasharray:14 10;animation:trazo 1.1s linear infinite}
@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:#161E2D}
  #escena{position:static;transform:none!important;width:1920px;height:auto}
  .slide{position:relative;height:1080px;opacity:1;visibility:visible;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .paso{opacity:1;transform:none}#barra{display:none}
}
</style>
</head>
<body>
<div id="escena">
{{slides}}
</div>
<div id="barra"></div>
<script>
const escena = document.getElementById('escena'), slides = [...document.querySelectorAll('.slide')];
let actual = 0;
function ajustar(){ const k = Math.min(innerWidth / 1920, innerHeight / 1080);
  escena.style.transform = `translate(${-960 * k}px, ${-540 * k}px) scale(${k})`; }
function pasos(s){ return [...s.querySelectorAll('.paso')].sort((a, b) => (+a.dataset.paso || 0) - (+b.dataset.paso || 0)); }
function mostrar(i, alFinal){ actual = Math.max(0, Math.min(slides.length - 1, i));
  slides.forEach((s, k) => s.classList.toggle('activa', k === actual));
  pasos(slides[actual]).forEach(p => p.classList.toggle('visto', !!alFinal));
  document.getElementById('barra').style.width = ((actual + 1) / slides.length * 100) + '%';
  history.replaceState(null, '', '#' + (actual + 1));
  slides[actual].dispatchEvent(new CustomEvent('entrar')); }
function siguiente(){ const p = pasos(slides[actual]).find(x => !x.classList.contains('visto'));
  if (p) { const n = p.dataset.paso; pasos(slides[actual]).filter(x => x.dataset.paso === n).forEach(x => x.classList.add('visto'));
    slides[actual].dispatchEvent(new CustomEvent('paso', { detail: +n })); }
  else if (actual < slides.length - 1) mostrar(actual + 1); }
function anterior(){ const v = pasos(slides[actual]).filter(x => x.classList.contains('visto'));
  if (v.length) { const n = v[v.length - 1].dataset.paso; v.filter(x => x.dataset.paso === n).forEach(x => x.classList.remove('visto')); }
  else if (actual > 0) mostrar(actual - 1, true); }
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(e.key)) { e.preventDefault(); siguiente(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); anterior(); }
  else if (e.key === 'Home') mostrar(0); else if (e.key === 'End') mostrar(slides.length - 1, true);
  else if (e.key === 'f' || e.key === 'F') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
addEventListener('click', e => { if (e.target.closest('a')) return; e.clientX > innerWidth * .3 ? siguiente() : anterior(); });
addEventListener('resize', ajustar);
slides.forEach((s, i) => { const n = s.querySelector('.pie .n'); if (n) n.textContent = String(i + 1).padStart(2, '0') + ' / ' + String(slides.length).padStart(2, '0'); });
ajustar(); mostrar((parseInt(location.hash.slice(1)) || 1) - 1, location.search.includes('todo'));
</script>
</body>
</html>
